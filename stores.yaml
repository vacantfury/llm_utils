# The data-lifecycle declaration (project_manager standard data-lifecycle, schema 2).
schema_version: 2
repo: llm_utils
stores:
  # Private notes that must never be public (AGENTS.md, Layout): site-specific cluster and account facts and
  # consumer records, written by this repo's sessions. Gitignored, so this folder is the only copy.
  - id: private-notes
    storage: {version: 1, type: folder, root: checkout, path: text_docs/private}
    placement: {version: 1, residency: [project], scope: one, sessions_write: true}
    lifecycle:
      version: 1
      kind: records
      keep: unique
      retention: {forever: true}
      live_reason: >-
        Two Markdown notes (site notes and consumer records) that sessions read whole and edit in place as this
        repo's current facts; no note finishes as a file that could move, an outdated fact is edited out
        (project_manager data-lifecycle standard df0a5294, Unique data has an end).
      operations: {compress: owner-press, retire: owner-press, archive: owner-press, move: owner-press}
      size_target:
        bytes: 1048576
        basis: >-
          20 KB on 2026-11-11 (two Markdown files). 1 MiB is years of notes at that pace; a reading over it is a
          look at what grew, never a removal.
  # One wheel (llm_utils 2.3.0, built 2026-07-23). No tag or commit names its exact source, so it counts as
  # unique and stays until the owner's press.
  - id: old-build
    storage: {version: 1, type: folder, root: checkout, path: dist}
    placement: {version: 1, residency: [project], scope: one, sessions_write: false}
    lifecycle:
      version: 1
      kind: builds
      keep: unique
      retention: {forever: true}
      operations: {compress: owner-press, retire: owner-press, archive: owner-press, move: owner-press}
      event:
        kind: superseded
        argv: [.venv/bin/python, -I, scripts/superseded_builds.py]
        basis: >-
          A build is finished once a newer release is tagged: every later version replaces it, and nothing installs
          from dist/. Items: each llm_utils wheel or sdist file directly under dist/ (links and other files are no
          item); its time is the creation time of the earliest vX.Y.Z tag newer than its version. Read-only; exits 1
          when dist/ or the tags cannot be read (project_manager data-lifecycle standard df0a5294, Events and
          archive).
      removal:
        argv: [../datastore/.venv/bin/python, -I, scripts/archive_removal.py, old-build]
        basis: >-
          A build file may go while its event still names it (an llm_utils wheel or sdist, a regular file directly
          under dist/, that a newer vX.Y.Z tag supersedes, read again when asked); a build no newer tag supersedes
          stays as still_read, anything else as other. Nothing reads dist/ and consumers install from the tags. Runs
          on datastore's own environment (datastore.archive_removal.serve), so this public package declares no
          dependency on it (scripts/archive_removal.py).
      archive_after:
        duration: P30D
        basis: >-
          The standard default: the one wheel (2.3.0) was superseded by v3.0.0 on 2026-07-24 and no code reads it,
          so a month past supersession is ample. Tuning path: the restores asked of archived items (one asked soon
          after archiving says the window is too short) and the host's disk readings.
      size_target:
        bytes: 131072
        basis: 64 KB on 2026-11-11 (one wheel); nothing writes here any more.
producers: []
