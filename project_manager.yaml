# Build facts only (project_manager design section 10): the effects floor, test and CI overrides. Everything
# else is derived or lives in psyche's oikos map, autoflow.yaml or stores.yaml.
schema: 1
project: llm_utils
facts:
  effects: []
validation:
  checks:
  - id: tests
    run:
    - uv
    - run
    - pytest
    - -q
    stages:
    - merge
    - ci
    - release
    - repair
ci:
  runner: ubuntu-latest
  transport: embedded
