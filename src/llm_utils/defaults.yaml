# llm_utils packaged defaults: the tunable knobs of the transport layer.
#
# Override per project with a YAML file of the same shape (only the keys you
# change): point LLM_UTILS_CONFIG at it, or put `llm_utils.yaml` in the
# project tree (found by an upward search from the working directory, like
# `.env`). Unknown keys are an error, so a typo never silently falls back to
# the default. Read through `llm_utils.config.get_config()`.

routes:
  # Seconds allowed for one reachability probe (`route_status(..., probe=True)`).
  # A probe is one unbilled GET (a model listing or an identity call); a slow
  # endpoint reads as unreachable. Tuning path: raise it if probes against
  # endpoints that serve real calls fine report `unreachable` (the probe's
  # reason string names the timeout).
  probe_timeout_s: 10.0

spend_cap:
  # US dollars of paid API spend one process may make (the "run"); null = no
  # cap. Checked before every paid call against recorded spend plus estimates
  # in flight (llm_utils.spend). A launcher running an approved larger job
  # sets LLM_UTILS_MAX_USD_PER_RUN, or the project sets this key in its
  # llm_utils.yaml. Basis for 5.0: above a routine single process (one
  # council sitting cost $0.79; a reasoning-model judge job about $0.08 of
  # real spend) and below an unapproved bulk sweep, the incident this control
  # exists for. Tuning path: per-process spend from the call ledger (rows
  # grouped by launch point and process); keep the cap above routine
  # processes' spend and below the smallest sweep that needed approval.
  max_usd_per_run: 5.0
  # Output tokens per request the pre-call estimate assumes when the caller
  # gives no expected_output_tokens (capped by the request's output budget).
  # Basis for 1024: judge / classification / extraction answers run to a few
  # hundred tokens, short reasoning to about a thousand; the full max_tokens
  # (4096-16384) overstated such jobs 10-40x and refused $0.40 jobs under a
  # $5 cap. Only admission uses it; batch auto-routing keeps max_tokens.
  # Tuning path: the call ledger's p95 output tokens per request by model
  # (rows carry output_tokens), recomputed as usage accumulates.
  assumed_output_tokens: 1024

call_ledger:
  # Seconds a successful census attribution (agent_manager census.resolve:
  # the calling file's repo and launch point) is reused before it is looked up
  # again, so a newly published oikos map or census row reaches a long-running
  # process; 0 = look up on every call. A refused or failed lookup is never
  # reused. The map's publication revision is not exposed by resolve, and the
  # census file changes apart from it, so the bound is time. Basis for 600:
  # one lookup costs about 0.4 s (agent_manager config load, measured
  # 2026-10-07), so one per calling file per 10 minutes stays under 0.1% of a
  # long process's time, while the map is republished about once a day (five
  # revisions 2026-10-01..05). Tuning path: lower it if a new repo or census
  # row must show in long-running processes sooner; raise it if the lookup
  # cost shows in per-call latency.
  attribution_ttl_s: 600.0
