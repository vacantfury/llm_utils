        \                     f'ssh://git@github.com/{owner}/{dep}.git'])\n    else:\n\
        \        config.touch()\n    secrets.clear()\n    keys.clear()\n    run(['uv',\
        \ 'tool', 'install', '--force', '--from', target, 'project_manager'])\n  \
        \  # A tag push re-tests nothing (t222): it installs the builder for tag-verify\
        \ and acquires none of the\n    # consumer's dependencies.\n    tag_push =\
        \ os.environ['EVENT_NAME'] == 'push' and os.environ['REF_TYPE'] == 'tag'\n\
        \    # Records mode (t220 step 1(c)): a branch push planned by the declared\
        \ release makes the run's one\n    # records decision here, before any consumer\
        \ dependency is installed, so the token is passed to that plan\n    # alone\
        \ and to no process after the sync, and a records plan acquires the project\
        \ environment only when\n    # a remaining check needs it.\n    before = None\n\
        \    if (os.environ['EVENT_NAME'] == 'push' and os.environ['REF_TYPE'] ==\
        \ 'branch' and source == 'tag'\n            and os.environ.get('GITHUB_EVENT_PATH')):\n\
        \        pushed = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())\n\
        \        before = pushed.get('before') if isinstance(pushed, dict) else None\n\
        \        before = before if isinstance(before, str) and re.fullmatch(r'[0-9a-f]{40}',\
        \ before) else None\n    lock = pathlib.Path('uv.lock').exists()\n    if (lock\
        \ or before) and not tag_push:\n        # Plan before acquisition ends: later\
        \ uv runs must find their extras/groups cached.\n        # Use the isolated\
        \ installed builder, never a consumer executable from PATH.\n        result\
        \ = subprocess.run(['uv', 'tool', 'dir', '--bin'], env=env,\n            \
        \                    capture_output=True, text=True, check=False)\n      \
        \  if result.returncode:\n            raise SystemExit(result.returncode)\n\
        \        tool_bin = pathlib.Path(result.stdout.strip())\n        if not tool_bin.is_absolute():\n\
        \            raise SystemExit('Isolated builder directory missing or malformed')\n\
        \        builder_cli = str(tool_bin / 'project_manager')\n        event =\
        \ os.environ['EVENT_NAME']\n        if event == 'push':\n            event\
        \ = 'tag' if os.environ['REF_TYPE'] == 'tag' else 'push'\n        elif event\
        \ == 'workflow_dispatch':\n            event = 'dispatch'\n        result\
        \ = subprocess.run([builder_cli, 'ci', 'plan', '--event', event, '--json',\n\
        \                                 *(['--base', before] if before else [])],\n\
        \                                env={**env, 'GH_TOKEN': token} if before\
        \ and token else env,\n                                capture_output=True,\
        \ text=True, check=False)\n        if os.environ.get('REPOSITORY_PRIVATE')\
        \ == 'true':\n            sys.stderr.write(result.stderr)\n            if\
        \ result.returncode:\n                sys.stderr.write(result.stdout)\n  \
        \      if result.returncode:\n            raise SystemExit(result.returncode)\n\
        \        planned = json.loads(result.stdout)\n        sync_args = planned.get('dependency_sync_args')\n\
        \        if (planned.get('status') != 'pass' or not isinstance(sync_args,\
        \ list)\n                or not sync_args or not all(isinstance(arg, str)\
        \ and arg for arg in sync_args)):\n            raise SystemExit('CI dependency\
        \ acquisition plan missing or malformed; check the builder pin')\n       \
        \ # CI's Python minor for a consumer that pins none (policy ci.yaml python):\
        \ the same request the\n        # local merge check makes, exported below\
        \ for every later consumer command.\n        requested_python = planned.get('python')\
        \ if lock else None\n        if requested_python is not None:\n          \
        \  if not isinstance(requested_python, str) or not re.fullmatch(r'[0-9]+\\\
        .[0-9]+', requested_python):\n                raise SystemExit('CI Python\
        \ request malformed; check the builder pin')\n            env['UV_PYTHON']\
        \ = requested_python\n        if before:\n            # The run's one records\
        \ decision, kept outside the checkout: Plan CI reads the plan back, and\n\
        \            # the Records check step re-verifies against P's merged, validated\
        \ proof, both without GitHub.\n            proof = planned.pop('records_proof',\
        \ None)\n            for name, kept in (('project-manager-records-plan.json',\
        \ planned),\n                               ('project-manager-records-base-proof.json',\
        \ proof)):\n                if kept is not None:\n                    handle\
        \ = os.open(os.path.join(os.environ['RUNNER_TEMP'], name),\n             \
        \                        os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)\n  \
        \                  with os.fdopen(handle, 'w') as stored:\n              \
        \          json.dump(kept, stored)\n        if lock and (planned.get('mode')\
        \ != 'records' or planned.get('records_sync') is True):\n            run(['uv',\
        \ 'sync', '--frozen', *sync_args])\n# Credentials are gone before publishing\
        \ the tool path or running any consumer setup.\nresult = subprocess.run(['uv',\
        \ 'tool', 'dir', '--bin'], capture_output=True, text=True, check=False)\n\
        if os.environ.get('REPOSITORY_PRIVATE') == 'true':\n    sys.stderr.write(result.stderr)\n\
        if result.returncode:\n    raise SystemExit(result.returncode)\nwith open(os.environ['GITHUB_PATH'],\
        \ 'a') as path:\n    path.write(result.stdout.strip() + '\\n')\nif requested_python\
        \ is not None:\n    with open(os.environ['GITHUB_ENV'], 'a') as exported:\n\
        \        exported.write('UV_PYTHON=' + requested_python + '\\n')\nPYTHON\n"
    - name: Plan CI
      if: ${{ steps.guard.outputs.acquire == 'true' }}
      id: plan
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
      shell: bash
      run: "rm -f \"$RUNNER_TEMP/project-manager-summary.json\" \"$RUNNER_TEMP/project-manager-drift.json\"\
        \nlog=$(mktemp \"$RUNNER_TEMP/project-manager-log.XXXXXX\")\ntrap 'status=$?;\
        \ if [ -f \"$RUNNER_TEMP/project-manager-summary.json\" ]; then cat \"$RUNNER_TEMP/project-manager-summary.json\"\
        ; fi; if [ \"${REPOSITORY_PRIVATE:-}\" = true ]; then cat \"$log\"; elif [\
        \ \"$status\" -ne 0 ]; then echo \"::error::CI helper failed (exit $status);\
        \ diagnostics withheld\"; fi; rm -f \"$log\"; exit \"$status\"' EXIT\nuv run\
        \ --isolated --no-project --python \"$HELPER_PYTHON\" python - >\"$log\" 2>&1\
        \ <<'PYTHON'\nimport json, os, pathlib, subprocess, sys\nroot = pathlib.Path(os.environ['RUNNER_TEMP'])\n\
        plan_path = root / 'project-manager-plan.json'\nsummary_path = root / 'project-manager-summary.json'\n\
        plan_path.unlink(missing_ok=True)\nsummary_path.unlink(missing_ok=True)\n\
        event = os.environ['EVENT_NAME']\nif event == 'push':\n    event = 'tag' if\
        \ os.environ['REF_TYPE'] == 'tag' else 'push'\nelif event == 'workflow_dispatch':\n\
        \    event = 'dispatch'\nif event not in {'push', 'tag', 'schedule', 'dispatch'}:\n\
        \    raise SystemExit('Unsupported CI event')\nkept = root / 'project-manager-records-plan.json'\n\
        if kept.exists():\n    # Acquisition made this run's one records decision\
        \ (t220 step 1(c)); read it back, reading no GitHub.\n    document = json.loads(kept.read_text())\n\
        \    kept.unlink()\n    returncode = 0 if document.get('exit_code') == 0 else\
        \ 1\nelse:\n    result = subprocess.run(['project_manager', 'ci', 'plan',\
        \ '--event', event, '--json'],\n                            capture_output=True,\
        \ text=True)\n    if os.environ.get('REPOSITORY_PRIVATE') == 'true':\n   \
        \     sys.stderr.write(result.stderr)\n    document = json.loads(result.stdout)\n\
        \    returncode = result.returncode\n# Execution arguments stay in a private\
        \ runner file, never outputs, logs or displayed environment.\nfd = os.open(plan_path,\
        \ os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)\nwith os.fdopen(fd, 'w') as\
        \ local:\n    json.dump(document, local)\nif document.get('drift'):\n    drift_path\
        \ = pathlib.Path(os.environ['RUNNER_TEMP']) / 'project-manager-drift.json'\n\
        \    fd = os.open(drift_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)\n\
        \    with os.fdopen(fd, 'w') as local:\n        json.dump(document['drift'],\
        \ local)\nsummary = {\n    'status': document.get('status') if document.get('status')\
        \ in {'pass', 'fail', 'unknown'} else 'unknown',\n    'run_checks': document.get('run_checks')\
        \ is True and returncode == 0,\n    'records': document.get('mode') == 'records'\
        \ and returncode == 0,\n    'tier': document.get('tier') if document.get('tier')\
        \ in {'T0', 'T1', 'T2', 'T3'} else 'unknown',\n    'checks': len(document.get('checks',\
        \ [])),\n    'errors': len(document.get('errors', [])),\n    'warnings': len(document.get('warnings',\
        \ [])),\n}\npublic = json.dumps(summary, sort_keys=True)\nwith open(os.environ['GITHUB_OUTPUT'],\
        \ 'a') as output:\n    output.write('plan=' + public + '\\n')\nsummary_path.write_text(public\
        \ + '\\n')\nraise SystemExit(returncode)\nPYTHON\n"
    - name: Declared CI setup
      if: ${{ steps.guard.outputs.acquire == 'true' && (fromJSON(steps.plan.outputs.plan).run_checks
        || fromJSON(steps.plan.outputs.plan).records) }}
      shell: bash
      run: "log=$(mktemp \"$RUNNER_TEMP/project-manager-log.XXXXXX\")\ntrap 'status=$?;\
        \ if [ \"${REPOSITORY_PRIVATE:-}\" = true ]; then cat \"$log\"; elif [ \"\
        $status\" -ne 0 ]; then echo \"::error::CI helper failed (exit $status); diagnostics\
        \ withheld\"; fi; rm -f \"$log\"; exit \"$status\"' EXIT\nuv run --no-project\
        \ --python \"$HELPER_PYTHON\" python - >\"$log\" 2>&1 <<'PYTHON'\nimport json,\
        \ os, pathlib, shutil, subprocess, sys, tempfile\nplan_path = pathlib.Path(os.environ['RUNNER_TEMP'])\
        \ / 'project-manager-plan.json'\nplan = json.loads(plan_path.read_text())\n\
        plan_path.unlink()\nenv = os.environ.copy()\nenv.pop('INHERITED_SECRETS',\
        \ None)\ncheckout = pathlib.Path.cwd()\nenv['PATH'] = str(checkout / '.venv/bin')\
        \ + os.pathsep + env['PATH']\nfor step in plan.get('setup', []):\n    with\
        \ tempfile.TemporaryFile() as log:\n        result = subprocess.run(step['run'],\
        \ cwd=checkout, env=env, shell=False, stdout=log, stderr=log)\n        if\
        \ os.environ.get('REPOSITORY_PRIVATE') == 'true':\n            log.seek(0)\n\
        \            shutil.copyfileobj(log, sys.stdout.buffer)\n    if result.returncode:\n\
        \        raise SystemExit(result.returncode)\nraise SystemExit(0)\nPYTHON\n"
    - name: Select covered tests
      id: selection
      if: ${{ steps.guard.outputs.validation == 'true' && fromJSON(steps.plan.outputs.plan).run_checks
        }}
      env:
        TEST_REASONS: '{"reasons": [{"basis": "agent_manager:pyproject.toml dependency
          on llm_utils; agent_manager:pyproject.toml dependency on llm_utils; auto_research:pyproject.toml
          dependency on llm_utils; autoflow:pyproject.toml dependency on llm_utils;
          courier:pyproject.toml dependency on llm_utils; llm_agent_security:pyproject.toml
          dependency on llm_utils; llm_guardrail_security:pyproject.toml dependency
          on llm_utils; model_internals_safety:pyproject.toml dependency on llm_utils;
          personal_passive_asset:pyproject.toml dependency on llm_utils; personal_trade:pyproject.toml
          dependency on llm_utils; prospector:pyproject.toml dependency on llm_utils;
          psyche:pyproject.toml dependency on llm_utils", "paths": ["src/llm_utils"],
          "reason": "crosses", "source": "derived"}, {"basis": "visibility public,
          a declared release, no interface_of", "paths": ["src/llm_utils"], "reason":
          "crosses", "source": "derived"}]}'
      shell: bash
      run: "uv run --no-project --python \"$HELPER_PYTHON\" python - <<'PYTHON'\n\
        import json, os, pathlib, subprocess\ntool_bin = subprocess.check_output(['uv',\
        \ 'tool', 'dir', '--bin'], text=True).strip()\nbuilder = str(pathlib.Path(tool_bin)\
        \ / 'project_manager')\nhead = subprocess.check_output(['git', 'rev-parse',\
        \ 'HEAD'], text=True).strip()\nevent = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())\n\
        partial = os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ.get('GITHUB_REF_TYPE')\
        \ == 'branch'\nargv = [builder, 'ci', 'select', '--repo', '.', '--base', event.get('before')\
        \ or 'missing',\n        '--head', head, '--json']\nif not partial:\n    argv.append('--all')\n\
        if os.environ.get('TEST_REASONS'):\n    argv += ['--reasons', os.environ['TEST_REASONS']]\n\
        destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'project-manager-test-selection.json'\n\
        with destination.open('w') as output:\n    subprocess.run(argv, stdout=output,\
        \ check=True)\ndecision = json.loads(destination.read_text())\nwith open(os.environ['GITHUB_OUTPUT'],\
        \ 'a') as output:\n    output.write('path=' + str(destination) + '\\n')\n\
        \    output.write('mode=' + decision['mode'] + '\\n')\nPYTHON\n"
    - name: Validation contract and declared hygiene
      id: checks
      if: ${{ steps.guard.outputs.validation == 'true' && fromJSON(steps.plan.outputs.plan).run_checks
        }}
      env:
        PROJECT_MANAGER_RECORDS_PROOF: ${{ github.event_name == 'push' && github.ref
          == 'refs/heads/main' && format('{0}/project-manager-records-proof/records-proof.json',
          runner.temp) || '' }}
        TEST_SELECTION: ${{ steps.selection.outputs.path }}
        EXTRA_MARKERS: ''
        SHARD: ${{ matrix.shard }}
        SHARD_INDEX: ${{ strategy.job-index }}
        SHARD_TOTAL: ${{ strategy.job-total }}
      shell: bash
      run: "log=$(mktemp \"$RUNNER_TEMP/project-manager-log.XXXXXX\")\nCHECK_DOCUMENT=$(mktemp\
        \ \"$RUNNER_TEMP/project-manager-checks.XXXXXX\")\nexport CHECK_DOCUMENT\n\
        # The check document is restrained, actionable output for every caller, including\
        \ failures.\ntrap 'status=$?; cat \"$CHECK_DOCUMENT\"; if [ \"${REPOSITORY_PRIVATE:-}\"\
        \ = true ]; then cat \"$log\"; elif [ \"$status\" -ne 0 ]; then echo \"::error::CI\
        \ checks failed (exit $status); raw diagnostics withheld\"; fi; rm -f \"$log\"\
        \ \"$CHECK_DOCUMENT\"; exit \"$status\"' EXIT\nuv run --no-project --python\
        \ \"$HELPER_PYTHON\" python - >\"$log\" 2>&1 <<'PYTHON'\nimport json, os,\
        \ pathlib, shlex, subprocess, tomllib\nenv = os.environ.copy()\nextra = env.pop('EXTRA_MARKERS')\n\
        check_document = env.pop('CHECK_DOCUMENT')\nshard, index, total = env.pop('SHARD',\
        \ ''), int(env.pop('SHARD_INDEX', '0')), int(env.pop('SHARD_TOTAL', '1'))\n\
        if extra:\n    # Read the consumer's selection; an explicit release expression\
        \ adds to it.\n    settings = tomllib.loads(pathlib.Path('pyproject.toml').read_text())\n\
        \    addopts = settings.get('tool', {}).get('pytest', {}).get('ini_options',\
        \ {}).get('addopts', '')\n    options = shlex.split(addopts) if isinstance(addopts,\
        \ str) else addopts\n    expression = None\n    for position, option in enumerate(options):\n\
        \        if option == '-m':\n            expression = options[position + 1]\n\
        \        elif option.startswith('-m'):\n            expression = option[2:]\n\
        \    # No selection means all tests already run; adding an expression must\
        \ not narrow it.\n    if expression:\n        selection = f'({expression})\
        \ or ({extra})'\n        env['PYTEST_ADDOPTS'] = shlex.join(['-m', selection])\n\
        # Resolve the isolated tool before exposing consumer hygiene executables on\
        \ PATH.\ntool_bin = subprocess.check_output(['uv', 'tool', 'dir', '--bin'],\
        \ text=True).strip()\nbuilder = str(pathlib.Path(tool_bin) / 'project_manager')\n\
        env['PATH'] = str(pathlib.Path('.venv/bin').resolve()) + os.pathsep + env['PATH']\n\
        # The red-run loop (t167, design section 5 rule 7): a failed declared check\
        \ runs once more; a second\n# pass reports flaky. The workflow is version-locked\
        \ with the builder it installs, which accepts the flag.\nshard_args = []\n\
        if total > 1:\n    # The job name carries matrix.shard and the selection job-index\
        \ + 1; ci sync lists 1..N in order.\n    if shard != str(index + 1):\n   \
        \     raise SystemExit('CI shard matrix must list 1..N in order; run ci sync')\n\
        \    shard_args = ['--shard', f'{index + 1}/{total}']\nargv = [builder, 'check',\
        \ '--stage', 'ci', '--rerun-failed-once', *shard_args]\nselected = env.pop('TEST_SELECTION',\
        \ '')\nif selected:\n    argv += ['--test-selection', selected]\nif env.get('REPOSITORY_PRIVATE')\
        \ == 'true':\n    # Private logs already replay raw diagnostics; the bounded\
        \ summary names the failing tests.\n    argv.append('--failure-summary')\n\
        with open(check_document, 'w') as document:\n    result = subprocess.run(argv,\
        \ env=env, stdout=document)\nraise SystemExit(result.returncode)\nPYTHON\n"
    - name: Records check
      id: records
      if: ${{ steps.guard.outputs.validation == 'true' && fromJSON(steps.plan.outputs.plan).records
        && strategy.job-index == 0 }}
      shell: bash
      run: "log=$(mktemp \"$RUNNER_TEMP/project-manager-log.XXXXXX\")\nCHECK_DOCUMENT=$(mktemp\
        \ \"$RUNNER_TEMP/project-manager-checks.XXXXXX\")\nexport CHECK_DOCUMENT\n\
        trap 'status=$?; cat \"$CHECK_DOCUMENT\"; if [ \"${REPOSITORY_PRIVATE:-}\"\
        \ = true ]; then cat \"$log\"; elif [ \"$status\" -ne 0 ]; then echo \"::error::CI\
        \ checks failed (exit $status); raw diagnostics withheld\"; fi; rm -f \"$log\"\
        \ \"$CHECK_DOCUMENT\"; exit \"$status\"' EXIT\nuv run --isolated --no-project\
        \ --python \"$HELPER_PYTHON\" python - >\"$log\" 2>&1 <<'PYTHON'\nimport json,\
        \ os, pathlib, re, subprocess\nenv = os.environ.copy()\ncheck_document = env.pop('CHECK_DOCUMENT')\n\
        pushed = json.loads(pathlib.Path(env['GITHUB_EVENT_PATH']).read_text())\n\
        before = pushed.get('before') if isinstance(pushed, dict) else None\nif not\
        \ isinstance(before, str) or not re.fullmatch(r'[0-9a-f]{40}', before):\n\
        \    raise SystemExit('Records check needs the push base')\n# Resolve the\
        \ isolated tool before exposing consumer executables on PATH.\ntool_bin =\
        \ subprocess.check_output(['uv', 'tool', 'dir', '--bin'], text=True).strip()\n\
        builder = str(pathlib.Path(tool_bin) / 'project_manager')\nenv['PATH'] = str(pathlib.Path('.venv/bin').resolve())\
        \ + os.pathsep + env['PATH']\nkept = str(pathlib.Path(env['RUNNER_TEMP'])\
        \ / 'project-manager-records-base-proof.json')\nargv = [builder, 'check',\
        \ '--stage', 'ci', '--records-since', before, '--records-base-proof', kept,\n\
        \        '--rerun-failed-once']\nif env.get('REPOSITORY_PRIVATE') == 'true':\n\
        \    argv.append('--failure-summary')\nwith open(check_document, 'w') as document:\n\
        \    result = subprocess.run(argv, env=env, stdout=document)\nif result.returncode\
        \ == 0:\n    records = json.loads(pathlib.Path(check_document).read_text()).get('records')\
        \ or {}\n    base = records.get('base')\n    if records.get('class') != 'records'\
        \ or not isinstance(base, str) or not re.fullmatch(r'[0-9a-f]{40}', base):\n\
        \        raise SystemExit('Records check passed without naming its records\
        \ base')\n    folder = pathlib.Path(env['RUNNER_TEMP']) / 'project-manager-records-base'\n\
        \    folder.mkdir(exist_ok=True)\n    (folder / 'records-base.json').write_text(json.dumps({'base':\
        \ base}, sort_keys=True))\n    with open(env['GITHUB_OUTPUT'], 'a') as output:\n\
        \        output.write('base=' + base + '\\n')\nraise SystemExit(result.returncode)\n\
        PYTHON\n"
    - name: Upload records base
      if: ${{ !cancelled() && steps.records.outcome == 'success' && steps.records.outputs.base
        != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ format('records-base-{0}', steps.records.outputs.base) }}
        path: ${{ runner.temp }}/project-manager-records-base
        if-no-files-found: error
        overwrite: true
        retention-days: 90
    - name: Upload records proof
      if: ${{ !cancelled() && steps.checks.outcome == 'success' && github.event_name
        == 'push' && github.ref == 'refs/heads/main' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ strategy.job-total > 1 && format('records-proof-{0}-of-{1}', matrix.shard,
          strategy.job-total) || 'records-proof' }}
        path: ${{ runner.temp }}/project-manager-records-proof
        if-no-files-found: ignore
        overwrite: true
        retention-days: 14
    - name: Declared drift check
      if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.guard.outputs.drift
        == 'true' && !(github.event_name == 'push' && github.ref_type == 'tag') &&
        strategy.job-index == 0 }}
      shell: bash
      run: "uv run --no-project --python \"$HELPER_PYTHON\" python - <<'PYTHON'\n\
        import json, os, pathlib, subprocess\ndrift = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])\
        \ / 'project-manager-drift.json').read_text())\nif not drift:\n    raise SystemExit('Scheduled\
        \ drift declaration missing')\nenv = os.environ.copy()\nenv.pop('GH_TOKEN',\
        \ None)\nenv['PATH'] = str(pathlib.Path('.venv/bin').resolve()) + os.pathsep\
        \ + env['PATH']\nwith open(os.devnull, 'w') as log:\n    result = subprocess.run(drift['run'],\
        \ env=env, shell=False, stdout=log, stderr=log)\nraise SystemExit(result.returncode)\n\
        PYTHON\n"
    - name: Preserve failed validation
      if: ${{ always() && steps.guard.outputs.blocked == 'true' && strategy.job-index
        == 0 }}
      shell: bash
      run: exit 1
    - name: tag-verify
      if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && strategy.job-index
        == 0 }}
      working-directory: ${{ github.workspace }}
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "# checkout does not retain auth. Its per-command helper uses the job token\n\
        # without storing it in repository configuration or printing it. A review\
        \ binding\n# needs the previous release tag and the history back to it, so\
        \ the shallow\n# checkout is deepened and every tag fetched.\nauth=(-c credential.helper=\
        \ -c 'credential.helper=!gh auth git-credential')\n# A repository is strict\
        \ from its first admitted release, which writes the notes ref\n# (policy release.yaml\
        \ release_paths). ls-remote exits 2 when the ref is absent; any other\n# failure\
        \ is an unreadable remote, never a legacy repository.\nmarker=0\ngit \"${auth[@]}\"\
        \ ls-remote --exit-code origin refs/notes/project_manager > /dev/null || marker=$?\n\
        refspecs=('+refs/tags/*:refs/tags/*')\ncase \"$marker\" in\n  0) release_path=admitted;\
        \ refspecs+=('refs/notes/project_manager:refs/notes/project_manager') ;;\n\
        \  2) release_path=legacy ;;\n  *) echo \"::error title=tag-verify::cannot\
        \ read the release-notes ref from origin (git ls-remote exit $marker)\"\n\
        \     exit \"$marker\" ;;\nesac\ndepth=()\nif [ \"$(git rev-parse --is-shallow-repository)\"\
        \ = true ]; then depth=(--unshallow); fi\ngit \"${auth[@]}\" fetch \"${depth[@]}\"\
        \ origin \"${refspecs[@]}\"\nstatus=0\ndocument=$(project_manager release\
        \ verify-tag --tag \"$RELEASE_TAG\" --release-path \"$release_path\") || status=$?\n\
        printf '%s\\n' \"$document\"\nif [ \"$status\" -ne 0 ]; then exit \"$status\"\
        ; fi\n# An advisory verdict becomes a run annotation carrying the verifier's\
        \ own reason. This step holds the\n# token, so the helper reads no uv configuration\
        \ (--no-config).\nprintf '%s' \"$document\" | uv run --isolated --no-project\
        \ --no-config --python \"$HELPER_PYTHON\" python -c '\nimport json, sys\n\
        document = json.load(sys.stdin)\nif document.get(\"status\") == \"advisory\"\
        :\n    escaped = document[\"reason\"].replace(\"%\", \"%25\").replace(\"\\\
        r\", \"%0D\").replace(\"\\n\", \"%0A\")\n    print(\"::warning title=tag-verify::\"\
        \ + escaped)'\n"
    - name: Remove local CI plan
      if: ${{ always() }}
      shell: bash
      run: rm -f "$RUNNER_TEMP/project-manager-plan.json" "$RUNNER_TEMP/project-manager-summary.json"
        "$RUNNER_TEMP/project-manager-drift.json" "$RUNNER_TEMP/project-manager-records-plan.json"
        "$RUNNER_TEMP/project-manager-records-base-proof.json"
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      }}
