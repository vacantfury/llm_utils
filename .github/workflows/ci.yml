        \ = subprocess.run([builder_cli, 'ci', 'plan', '--event', event, '--json'],\n\
        \                                env=env, capture_output=True, text=True,\
        \ check=False)\n        if os.environ.get('REPOSITORY_PRIVATE') == 'true':\n\
        \            sys.stderr.write(result.stderr)\n            if result.returncode:\n\
        \                sys.stderr.write(result.stdout)\n        if result.returncode:\n\
        \            raise SystemExit(result.returncode)\n        planned = json.loads(result.stdout)\n\
        \        sync_args = planned.get('dependency_sync_args')\n        if (planned.get('status')\
        \ != 'pass' or not isinstance(sync_args, list)\n                or not sync_args\
        \ or not all(isinstance(arg, str) and arg for arg in sync_args)):\n      \
        \      raise SystemExit('CI dependency acquisition plan missing or malformed;\
        \ check the builder pin')\n        # CI's Python minor for a consumer that\
        \ pins none (policy ci.yaml python): the same request the\n        # local\
        \ merge check makes, exported below for every later consumer command.\n  \
        \      requested_python = planned.get('python')\n        if requested_python\
        \ is not None:\n            if not isinstance(requested_python, str) or not\
        \ re.fullmatch(r'[0-9]+\\.[0-9]+', requested_python):\n                raise\
        \ SystemExit('CI Python request malformed; check the builder pin')\n     \
        \       env['UV_PYTHON'] = requested_python\n        run(['uv', 'sync', '--frozen',\
        \ *sync_args])\n# Credentials are gone before publishing the tool path or\
        \ running any consumer setup.\nresult = subprocess.run(['uv', 'tool', 'dir',\
        \ '--bin'], capture_output=True, text=True, check=False)\nif os.environ.get('REPOSITORY_PRIVATE')\
        \ == 'true':\n    sys.stderr.write(result.stderr)\nif result.returncode:\n\
        \    raise SystemExit(result.returncode)\nwith open(os.environ['GITHUB_PATH'],\
        \ 'a') as path:\n    path.write(result.stdout.strip() + '\\n')\nif requested_python\
        \ is not None:\n    with open(os.environ['GITHUB_ENV'], 'a') as exported:\n\
        \        exported.write('UV_PYTHON=' + requested_python + '\\n')\nPYTHON\n"
    - name: Plan CI
      if: ${{ steps.guard.outputs.acquire == 'true' }}
      id: plan
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
      shell: bash
      run: "rm -f \"$RUNNER_TEMP/project-manager-summary.json\" \"$RUNNER_TEMP/project-manager-drift.json\"\
        \nlog=$(mktemp \"$RUNNER_TEMP/project-manager-log.XXXXXX\")\ntrap 'status=$?;\
        \ if [ -f \"$RUNNER_TEMP/project-manager-summary.json\" ]; then cat \"$RUNNER_TEMP/project-manager-summary.json\"\
        ; fi; if [ \"${REPOSITORY_PRIVATE:-}\" = true ]; then cat \"$log\"; elif [\
        \ \"$status\" -ne 0 ]; then echo \"::error::CI helper failed (exit $status);\
        \ diagnostics withheld\"; fi; rm -f \"$log\"; exit \"$status\"' EXIT\nuv run\
        \ --no-project --python \"$HELPER_PYTHON\" python - >\"$log\" 2>&1 <<'PYTHON'\n\
        import json, os, pathlib, subprocess, sys\nroot = pathlib.Path(os.environ['RUNNER_TEMP'])\n\
        plan_path = root / 'project-manager-plan.json'\nsummary_path = root / 'project-manager-summary.json'\n\
        plan_path.unlink(missing_ok=True)\nsummary_path.unlink(missing_ok=True)\n\
        event = os.environ['EVENT_NAME']\nif event == 'push':\n    event = 'tag' if\
        \ os.environ['REF_TYPE'] == 'tag' else 'push'\nelif event == 'workflow_dispatch':\n\
        \    event = 'dispatch'\nif event not in {'push', 'tag', 'schedule', 'dispatch'}:\n\
        \    raise SystemExit('Unsupported CI event')\nresult = subprocess.run(['project_manager',\
        \ 'ci', 'plan', '--event', event, '--json'],\n                        capture_output=True,\
        \ text=True)\nif os.environ.get('REPOSITORY_PRIVATE') == 'true':\n    sys.stderr.write(result.stderr)\n\
        document = json.loads(result.stdout)\n# Execution arguments stay in a private\
        \ runner file, never outputs, logs or displayed environment.\nfd = os.open(plan_path,\
        \ os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)\nwith os.fdopen(fd, 'w') as\
        \ local:\n    json.dump(document, local)\nif document.get('drift'):\n    drift_path\
        \ = pathlib.Path(os.environ['RUNNER_TEMP']) / 'project-manager-drift.json'\n\
        \    fd = os.open(drift_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)\n\
        \    with os.fdopen(fd, 'w') as local:\n        json.dump(document['drift'],\
        \ local)\nsummary = {\n    'status': document.get('status') if document.get('status')\
        \ in {'pass', 'fail', 'unknown'} else 'unknown',\n    'run_checks': document.get('run_checks')\
        \ is True and result.returncode == 0,\n    'tier': document.get('tier') if\
        \ document.get('tier') in {'T0', 'T1', 'T2', 'T3'} else 'unknown',\n    'checks':\
        \ len(document.get('checks', [])),\n    'errors': len(document.get('errors',\
        \ [])),\n    'warnings': len(document.get('warnings', [])),\n}\npublic = json.dumps(summary,\
        \ sort_keys=True)\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n\
        \    output.write('plan=' + public + '\\n')\nsummary_path.write_text(public\
        \ + '\\n')\nraise SystemExit(result.returncode)\nPYTHON\n"
    - name: Declared CI setup
      if: ${{ steps.guard.outputs.acquire == 'true' && fromJSON(steps.plan.outputs.plan).run_checks
        }}
      shell: bash
      run: "log=$(mktemp \"$RUNNER_TEMP/project-manager-log.XXXXXX\")\ntrap 'status=$?;\
        \ if [ \"${REPOSITORY_PRIVATE:-}\" = true ]; then cat \"$log\"; elif [ \"\
        $status\" -ne 0 ]; then echo \"::error::CI helper failed (exit $status); diagnostics\
        \ withheld\"; fi; rm -f \"$log\"; exit \"$status\"' EXIT\nuv run --no-project\
        \ --python \"$HELPER_PYTHON\" python - >\"$log\" 2>&1 <<'PYTHON'\nimport json,\
        \ os, pathlib, shutil, subprocess, sys, tempfile\nplan_path = pathlib.Path(os.environ['RUNNER_TEMP'])\
        \ / 'project-manager-plan.json'\nplan = json.loads(plan_path.read_text())\n\
        plan_path.unlink()\nenv = os.environ.copy()\nenv.pop('INHERITED_SECRETS',\
        \ None)\ncheckout = pathlib.Path.cwd()\nenv['PATH'] = str(checkout / '.venv/bin')\
        \ + os.pathsep + env['PATH']\nfor step in plan.get('setup', []):\n    with\
        \ tempfile.TemporaryFile() as log:\n        result = subprocess.run(step['run'],\
        \ cwd=checkout, env=env, shell=False, stdout=log, stderr=log)\n        if\
        \ os.environ.get('REPOSITORY_PRIVATE') == 'true':\n            log.seek(0)\n\
        \            shutil.copyfileobj(log, sys.stdout.buffer)\n    if result.returncode:\n\
        \        raise SystemExit(result.returncode)\nraise SystemExit(0)\nPYTHON\n"
    - name: Fetch the admitted base
      if: ${{ steps.guard.outputs.validation == 'true' && github.event_name == 'push'
        && github.ref == format('refs/heads/{0}', env.LAND_BRANCH) }}
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: '# checkout does not retain auth; the per-command helper uses the job token
        without storing it.

        auth=(-c credential.helper= -c ''credential.helper=!gh auth git-credential'')

        depth=()

        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then depth=(--unshallow);
        fi

        # Freeze admission reads the explicit base and its release tag; an unreadable
        fetch fails closed.

        git "${auth[@]}" fetch --tags "${depth[@]}" origin ''+refs/heads/main:refs/remotes/origin/main''

        '
    - name: Validation contract and declared hygiene
      id: checks
      if: ${{ steps.guard.outputs.validation == 'true' && fromJSON(steps.plan.outputs.plan).run_checks
        }}
      env:
        EXTRA_MARKERS: ''
        SHARD: ${{ matrix.shard }}
        SHARD_INDEX: ${{ strategy.job-index }}
        SHARD_TOTAL: ${{ strategy.job-total }}
      shell: bash
      run: "log=$(mktemp \"$RUNNER_TEMP/project-manager-log.XXXXXX\")\nCHECK_DOCUMENT=$(mktemp\
        \ \"$RUNNER_TEMP/project-manager-checks.XXXXXX\")\nexport CHECK_DOCUMENT\n\
        # The check document is restrained, actionable output for every caller, including\
        \ failures.\ntrap 'status=$?; cat \"$CHECK_DOCUMENT\"; if [ \"${REPOSITORY_PRIVATE:-}\"\
        \ = true ]; then cat \"$log\"; elif [ \"$status\" -ne 0 ]; then echo \"::error::CI\
        \ checks failed (exit $status); raw diagnostics withheld\"; fi; rm -f \"$log\"\
        \ \"$CHECK_DOCUMENT\"; exit \"$status\"' EXIT\nuv run --no-project --python\
        \ \"$HELPER_PYTHON\" python - >\"$log\" 2>&1 <<'PYTHON'\nimport json, os,\
        \ pathlib, shlex, subprocess, sys, tomllib\n\n\ndef redact(node):\n    \"\"\
        \"A result without its failure summaries' first lines (they quote test output);\
        \ ids and counts stay.\"\"\"\n    if isinstance(node, list):\n        return\
        \ [redact(item) for item in node]\n    if isinstance(node, dict):\n      \
        \  return {key: redact(value) for key, value in node.items()\n           \
        \     if not (key == 'lines' and {'tests', 'total'} <= node.keys())}\n   \
        \ return node\n\n\ndef land(builder, env, shard_args, check_document, index,\
        \ total):\n    \"\"\"The merge queue's staging branch (t175, design section\
        \ 5 Q6): the admitted base's requirements decide the\n    gate, as they do\
        \ locally (check --stage ci would read the candidate's own declaration). The\
        \ plan and this\n    job's result go to an artifact named for the commit and\
        \ shard (policy ci.yaml land.artifact).\"\"\"\n    temp = pathlib.Path(env['RUNNER_TEMP'])\n\
        \    # Landing records stay outside the checkout, as a data home does (land\
        \ plan refuses one inside it).\n    env['PROJECT_MANAGER_DATA_HOME'] = str(temp\
        \ / 'project-manager-land-home')\n    # The candidate snapshot's uv runs use\
        \ the environment acquired while the deploy keys existed.\n    env['UV_PROJECT_ENVIRONMENT']\
        \ = str(pathlib.Path('.venv').resolve())\n    planned = subprocess.run([builder,\
        \ 'land', 'plan', '--repo', '.', '--base', 'origin/main',\n              \
        \                '--candidate', 'HEAD', '--json'], env=env, capture_output=True,\
        \ text=True)\n    sys.stderr.write(planned.stderr)\n    try:\n        issued\
        \ = json.loads(planned.stdout)\n    except ValueError:\n        issued = {}\n\
        \    if (planned.returncode or not isinstance(issued, dict) or not isinstance(issued.get('digest'),\
        \ str)\n            or not isinstance(issued.get('plan'), dict)):\n      \
        \  # Plan's own answer (status, reason, reason_code) is the step's result,\
        \ so the log shows why; the\n        # fixed text only when plan printed nothing\
        \ parseable (a pass without its plan included).\n        if isinstance(issued,\
        \ dict) and issued.get('status') not in (None, 'pass'):\n            answer\
        \ = {key: issued[key] for key in ('status', 'reason', 'reason_code') if key\
        \ in issued}\n            if env.get('REPOSITORY_PRIVATE') != 'true':\n  \
        \              answer = redact(answer)\n        else:\n            answer\
        \ = {'status': 'unknown', 'reason': 'land plan refused or unreadable',\n \
        \                     'reason_code': 'infrastructure'}\n        with open(check_document,\
        \ 'w') as document:\n            json.dump(answer, document, sort_keys=True)\n\
        \        return planned.returncode or 2\n    checked = subprocess.run([builder,\
        \ 'land', 'check', '--repo', '.', '--plan', issued['digest'], '--json',\n\
        \                              *shard_args], env=env, capture_output=True,\
        \ text=True)\n    sys.stderr.write(checked.stderr)\n    try:\n        result\
        \ = json.loads(checked.stdout)\n    except ValueError:\n        result = {'status':\
        \ 'unknown', 'reason': 'land check printed no result'}\n    if env.get('REPOSITORY_PRIVATE')\
        \ != 'true':\n        # Public logs and artifacts are disclosures: failing\
        \ test ids stay, their failure lines do not.\n        result = redact(result)\n\
        \    with open(check_document, 'w') as document:\n        json.dump(result,\
        \ document, sort_keys=True)\n    folder = temp / 'project-manager-land-artifact'\n\
        \    folder.mkdir(exist_ok=True)\n    (folder / 'plan.json').write_text(json.dumps(issued['plan'],\
        \ sort_keys=True))\n    (folder / 'result.json').write_text(json.dumps(result,\
        \ sort_keys=True))\n    name = 'land-{commit}-shard-{index}-of-{total}'.format(commit=env['GITHUB_SHA'],\
        \ index=index, total=total)\n    with open(env['GITHUB_OUTPUT'], 'a') as output:\n\
        \        output.write('land_artifact=' + name + '\\n')\n    return checked.returncode\n\
        \n\nenv = os.environ.copy()\nextra = env.pop('EXTRA_MARKERS')\ncheck_document\
        \ = env.pop('CHECK_DOCUMENT')\nshard, index, total = env.pop('SHARD', ''),\
        \ int(env.pop('SHARD_INDEX', '0')), int(env.pop('SHARD_TOTAL', '1'))\nif extra:\n\
        \    # Read the consumer's selection; an explicit release expression adds\
        \ to it.\n    settings = tomllib.loads(pathlib.Path('pyproject.toml').read_text())\n\
        \    addopts = settings.get('tool', {}).get('pytest', {}).get('ini_options',\
        \ {}).get('addopts', '')\n    options = shlex.split(addopts) if isinstance(addopts,\
        \ str) else addopts\n    expression = None\n    for position, option in enumerate(options):\n\
        \        if option == '-m':\n            expression = options[position + 1]\n\
        \        elif option.startswith('-m'):\n            expression = option[2:]\n\
        \    # No selection means all tests already run; adding an expression must\
        \ not narrow it.\n    if expression:\n        selection = f'({expression})\
        \ or ({extra})'\n        env['PYTEST_ADDOPTS'] = shlex.join(['-m', selection])\n\
        # Resolve the isolated tool before exposing consumer hygiene executables on\
        \ PATH.\ntool_bin = subprocess.check_output(['uv', 'tool', 'dir', '--bin'],\
        \ text=True).strip()\nbuilder = str(pathlib.Path(tool_bin) / 'project_manager')\n\
        env['PATH'] = str(pathlib.Path('.venv/bin').resolve()) + os.pathsep + env['PATH']\n\
        # The red-run loop (t167, design section 5 rule 7): a failed declared check\
        \ runs once more; a second\n# pass reports flaky. The workflow is version-locked\
        \ with the builder it installs, which accepts the flag.\nshard_args = []\n\
        if total > 1:\n    # The job name carries matrix.shard and the selection job-index\
        \ + 1; ci sync lists 1..N in order.\n    if shard != str(index + 1):\n   \
        \     raise SystemExit('CI shard matrix must list 1..N in order; run ci sync')\n\
        \    shard_args = ['--shard', f'{index + 1}/{total}']\nland_branch = env.pop('LAND_BRANCH',\
        \ '')\nif land_branch and env.get('GITHUB_EVENT_NAME') == 'push' and env.get('GITHUB_REF')\
        \ == 'refs/heads/' + land_branch:\n    raise SystemExit(land(builder, env,\
        \ shard_args, check_document, index + 1 if total > 1 else 1, total))\nargv\
        \ = [builder, 'check', '--stage', 'ci', '--rerun-failed-once', *shard_args]\n\
        if env.get('REPOSITORY_PRIVATE') == 'true':\n    # Private logs already replay\
        \ raw diagnostics; the bounded summary names the failing tests.\n    argv.append('--failure-summary')\n\
        with open(check_document, 'w') as document:\n    result = subprocess.run(argv,\
        \ env=env, stdout=document)\nraise SystemExit(result.returncode)\nPYTHON\n"
    - name: Upload landing evidence
      if: ${{ !cancelled() && steps.checks.outputs.land_artifact != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.checks.outputs.land_artifact }}
        path: ${{ runner.temp }}/project-manager-land-artifact
        if-no-files-found: error
        retention-days: 7
    - name: Declared drift check
      if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.guard.outputs.drift
        == 'true' && !(github.event_name == 'push' && github.ref_type == 'tag') &&
        strategy.job-index == 0 }}
      shell: bash
      run: "uv run --no-project --python \"$HELPER_PYTHON\" python - <<'PYTHON'\n\
        import json, os, pathlib, subprocess\ndrift = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])\
        \ / 'project-manager-drift.json').read_text())\nif not drift:\n    raise SystemExit('Scheduled\
        \ drift declaration missing')\nenv = os.environ.copy()\nenv.pop('GH_TOKEN',\
        \ None)\nenv['PATH'] = str(pathlib.Path('.venv/bin').resolve()) + os.pathsep\
        \ + env['PATH']\nwith open(os.devnull, 'w') as log:\n    result = subprocess.run(drift['run'],\
        \ env=env, shell=False, stdout=log, stderr=log)\nraise SystemExit(result.returncode)\n\
        PYTHON\n"
    - name: Preserve failed validation
      if: ${{ always() && steps.guard.outputs.blocked == 'true' && strategy.job-index
        == 0 }}
      shell: bash
      run: exit 1
    - name: tag-verify
      if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && strategy.job-index
        == 0 }}
      working-directory: ${{ github.workspace }}
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "# checkout does not retain auth. Its per-command helper uses the job token\n\
        # without storing it in repository configuration or printing it. A review\
        \ binding\n# needs the previous release tag and the history back to it, so\
        \ the shallow\n# checkout is deepened and every tag fetched.\nauth=(-c credential.helper=\
        \ -c 'credential.helper=!gh auth git-credential')\n# A repository is strict\
        \ from its first admitted release, which writes the notes ref\n# (policy release.yaml\
        \ release_paths). ls-remote exits 2 when the ref is absent; any other\n# failure\
        \ is an unreadable remote, never a legacy repository.\nmarker=0\ngit \"${auth[@]}\"\
        \ ls-remote --exit-code origin refs/notes/project_manager > /dev/null || marker=$?\n\
        refspecs=('+refs/tags/*:refs/tags/*')\ncase \"$marker\" in\n  0) release_path=admitted;\
        \ refspecs+=('refs/notes/project_manager:refs/notes/project_manager') ;;\n\
        \  2) release_path=legacy ;;\n  *) echo \"::error title=tag-verify::cannot\
        \ read the release-notes ref from origin (git ls-remote exit $marker)\"\n\
        \     exit \"$marker\" ;;\nesac\ndepth=()\nif [ \"$(git rev-parse --is-shallow-repository)\"\
        \ = true ]; then depth=(--unshallow); fi\ngit \"${auth[@]}\" fetch \"${depth[@]}\"\
        \ origin \"${refspecs[@]}\"\nstatus=0\ndocument=$(project_manager release\
        \ verify-tag --tag \"$RELEASE_TAG\" --release-path \"$release_path\") || status=$?\n\
        printf '%s\\n' \"$document\"\nif [ \"$status\" -ne 0 ]; then exit \"$status\"\
        ; fi\n# An advisory verdict becomes a run annotation carrying the verifier's\
        \ own reason.\nprintf '%s' \"$document\" | uv run --no-project --python \"\
        $HELPER_PYTHON\" python -c '\nimport json, sys\ndocument = json.load(sys.stdin)\n\
        if document.get(\"status\") == \"advisory\":\n    escaped = document[\"reason\"\
        ].replace(\"%\", \"%25\").replace(\"\\r\", \"%0D\").replace(\"\\n\", \"%0A\"\
        )\n    print(\"::warning title=tag-verify::\" + escaped)'\n"
    - name: Remove local CI plan
      if: ${{ always() }}
      shell: bash
      run: rm -f "$RUNNER_TEMP/project-manager-plan.json" "$RUNNER_TEMP/project-manager-summary.json"
        "$RUNNER_TEMP/project-manager-drift.json"
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pm-queue'
      || startsWith(github.ref, 'refs/tags/v') }}
