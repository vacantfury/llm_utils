name: keyless tests
# This public repository cannot call the estate's private shared CI, so it follows the shared CI's test rule here:
# a push to main runs only the tests its change reaches since the push before it (github.event.before, read with no
# run history; pytest-impacted, the tool the shared CI uses); a tag, the Sunday schedule, a manual run, a new branch
# or a forced history (no usable before) runs the whole suite.
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
# The job runs the repository's code and its PyPI dependencies, so its token only reads, whatever the repository's
# default token permissions are (Hephaestus's builder review 6, 2026-10-29).
permissions:
  contents: read
  actions: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The base is the push before this one, the shared CI's rule (ci.selection_base; owner 2026-10-29): no run
      # history is read. All zeros (a new branch, a forced history) or a commit this checkout lacks leaves no base.
      - name: Selection base
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$PUSH_BEFORE" in
            *[!0-9a-f]*|'') ;;
            *) if [ ${#PUSH_BEFORE} -eq 40 ] && [ -n "${PUSH_BEFORE//0/}" ] \
                 && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                 echo "SELECTION_BASE=$PUSH_BEFORE" >> "$GITHUB_ENV"
               fi ;;
          esac
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
      - run: uv sync --all-groups
      - name: Tests the change reaches
        run: |
          base="${SELECTION_BASE:-}"
          if [ -z "$base" ]; then
            echo "the whole suite runs ($GITHUB_EVENT_NAME, no base)"
            uv run pytest -q
            exit $?
          fi
          set +e
          uv run --with pytest-impacted==0.36.0 pytest -q --impacted --impacted-module=src/llm_utils \
            --impacted-git-mode=branch --impacted-base-branch="$base" --impacted-no-merge-base --impacted-tests-dir=tests
          code=$?
          set -e
          case $code in
            0|1) echo "tests the change since ${base:0:12} reaches"; exit $code ;;
            5) echo "no test reached by the change since ${base:0:12}"; exit 0 ;;
            *) echo "selection failed (exit $code); the whole suite runs"; uv run pytest -q ;;
          esac
