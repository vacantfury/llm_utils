name: keyless tests
# This public repository cannot call the estate's private shared CI, so it follows the shared CI's test rule here:
# a push to main runs only the tests its change reaches since this workflow's last green run (pytest-impacted, the
# tool the shared CI uses); a tag, the Sunday schedule, a manual run, or a missing green base runs the whole suite.
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
# The job runs the repository's code and its PyPI dependencies, so its token only reads, whatever the repository's
# default token permissions are (Hephaestus's builder review 6, 2026-10-29).
permissions:
  contents: read
  actions: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The last green base is read with the run's own token before anything from the repository is installed or
      # run, so no step that runs repository code holds the token; only the commit id reaches the test step.
      - name: Last green commit
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=20" \
            -q "[.workflow_runs[] | select(.head_sha != \"$GITHUB_SHA\")][0].head_sha // empty" 2>/dev/null || true)
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "SELECTION_BASE=$base" >> "$GITHUB_ENV"
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
      - run: uv sync --all-groups
      - name: Tests the change reaches
        run: |
          base="${SELECTION_BASE:-}"
          if [ -z "$base" ]; then
            echo "the whole suite runs ($GITHUB_EVENT_NAME, no green base used)"
            uv run pytest -q
            exit $?
          fi
          set +e
          uv run --with pytest-impacted==0.36.0 pytest -q --impacted --impacted-module=src/llm_utils \
            --impacted-git-mode=branch --impacted-base-branch="$base" --impacted-no-merge-base --impacted-tests-dir=tests
          code=$?
          set -e
          case $code in
            0|1) echo "tests the change since ${base:0:12} reaches"; exit $code ;;
            5) echo "no test reached by the change since ${base:0:12}"; exit 0 ;;
            *) echo "selection failed (exit $code); the whole suite runs"; uv run pytest -q ;;
          esac
