# llm_utils — consumer contract (charter §3.7 provider half). Machine-read truth; CONTRACT.md is rendered from it.
provider: llm_utils
version: 7.3.0
version_policy: semver
seams:
  - id: python-api
    kind: python-api
    package: llm_utils
    public:
      - llm_utils.call_ledger
      - llm_utils.LLMModel
      - llm_utils.Provider
      - llm_utils.ModelQuirk
      - llm_utils.BaseLLMService
      - llm_utils.UsageStats
      - llm_utils.LLMServiceFactory
      - llm_utils.AccountStatus
      - llm_utils.burn_rate
      - llm_utils.days_to_empty
      - llm_utils.is_mechanism_error
      - llm_utils.make_mechanism_error
      - llm_utils.strip_mechanism_error
      - llm_utils.FatalModelError
      - llm_utils.AccountFatalError
      - llm_utils.InvalidCredentialError
      - llm_utils.CreditsExhaustedError
      - llm_utils.OpenAIService
      - llm_utils.DeepSeekService
      - llm_utils.ZAIService
      - llm_utils.XAIService
      - llm_utils.MoonshotService
      - llm_utils.OpenRouterService
      - llm_utils.ClaudeService
      - llm_utils.GoogleService
      - llm_utils.LocalLMService
      - llm_utils.SlurmClusterService
      - llm_utils.BedrockService
    consumers: [psyche, autoflow, auto_research, courier, prospector, ties, personal_trade, personal_passive_asset]
    note: |
      The package's __all__. LLMServiceFactory.create(model, *, label=None, launch_point=None, ...) builds a service; BaseLLMService records usage through a consumer-installed usage hook, else (v7.1.0+) through the optional agent_manager call ledger (call_ledger.record_call). A failed call (v7.3.0+) records one zero-cost row with status error|timeout and error_class; a usage hook receives it only if it declares status and error_class (or **kwargs). LLMModel members are the model registry; removing a member is a MAJOR change.
deprecations: []
