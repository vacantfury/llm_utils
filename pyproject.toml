[project]
name = "llm_utils"
version = "5.0.0"
description = "One interface over LLM providers: OpenAI, Anthropic, Gemini, Bedrock, local HF models, and SLURM-cluster serving."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # openai floor: 2.47 is the verified version accepting httpx2 clients as http_client
    "openai>=2.47",
    # anthropic floor: 0.116 is the verified version with messages.parse
    # (structured outputs via output_format=pydantic model)
    "anthropic>=0.116",
    "google-genai>=1.0",
    "httpx2>=2.9",
    "python-dotenv>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
local = [
    "torch>=2.2",
    "transformers>=4.45",
]
bedrock = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.6",
]

# PEP 735 dependency groups for uv compatibility
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: tests that are slow and skipped by default",
]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "W293", "I001"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["N"]
